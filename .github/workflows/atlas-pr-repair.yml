name: Atlas PR Repair Plan

on:
  workflow_run:
    workflows: [Atlas PR Supervisor]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull-Request-Nummer
        required: true
        type: number
      expected_head_sha:
        description: Erwarteter vollständiger Head-SHA
        required: true
        type: string
      confirm:
        description: Zur Bestätigung exakt REPAIR eingeben
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: atlas-pr-repair-plan-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}-${{ github.event.workflow_run.pull_requests[0].head.sha || inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'workflow_dispatch' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "REPAIR"

      - name: Checkout trusted main branch
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Download trusted Supervisor observation
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: atlas-supervisor-observation
          path: ${{ runner.temp }}/atlas-supervisor-observation
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve manual or automatic trigger binding
        id: trigger
        uses: actions/github-script@v8
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          MANUAL_HEAD_SHA: ${{ inputs.expected_head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require("node:fs");
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("source", "manual");
              core.setOutput("pr-number", process.env.MANUAL_PR_NUMBER);
              core.setOutput("head-sha", process.env.MANUAL_HEAD_SHA);
              core.setOutput("trusted-workflow-sha", context.sha);
              return;
            }
            const observation = JSON.parse(fs.readFileSync(
              `${process.env.RUNNER_TEMP}/atlas-supervisor-observation/atlas-supervisor-observation.json`, "utf8",
            ));
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (observation.repository !== repository
                || observation.prNumber !== Number(process.env.SOURCE_PR_NUMBER)
                || observation.supervisorRunId !== Number(process.env.SOURCE_RUN_ID)
                || observation.supervisorRunAttempt !== Number(process.env.SOURCE_RUN_ATTEMPT)
                || !/^[0-9a-f]{40}$/i.test(observation.observedHeadSha)
                || !/^[0-9a-f]{40}$/i.test(observation.trustedWorkflowSha)) {
              core.setFailed("The trusted Supervisor observation does not match this workflow_run source.");
              return;
            }
            core.setOutput("source", "automatic");
            core.setOutput("pr-number", observation.prNumber);
            core.setOutput("head-sha", observation.observedHeadSha);
            core.setOutput("state-fingerprint", observation.stateFingerprint);
            core.setOutput("supervisor-status", observation.supervisor.status);
            core.setOutput("trusted-workflow-sha", observation.trustedWorkflowSha);

      - name: Load current pull request and verify head SHA
        id: pull
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.trigger.outputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ steps.trigger.outputs.head-sha }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("A valid pr_number is required.");
              return;
            }
            const expected = process.env.EXPECTED_HEAD_SHA;
            if (!/^[0-9a-f]{40}$/i.test(expected)) {
              core.setFailed("expected_head_sha must be a full 40-character SHA.");
              return;
            }
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
            if (pull.head.sha !== expected) {
              core.setFailed("expected_head_sha is stale; the pull request head has changed.");
              return;
            }
            core.setOutput("number", pull.number);
            core.setOutput("head-sha", pull.head.sha);
            core.setOutput("short-head-sha", pull.head.sha.slice(0, 12));

      - name: Collect bounded pull request diagnostics
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pull.outputs.head-sha }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const { deduplicateCheckRuns, findReviewPriority, normalizeCheckName } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-supervisor.mjs`).href
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
            if (pull.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed("expected_head_sha is stale; the pull request head has changed during collection.");
              return;
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const rawChecks = deduplicateCheckRuns(await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: pull.head.sha,
              per_page: 100,
            }));
            const workflowNames = new Map();
            for (const check of rawChecks) {
              const match = check.details_url?.match(/\/actions\/runs\/(\d+)/);
              if (!match || workflowNames.has(match[1])) continue;
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(match[1]) });
                workflowNames.set(match[1], run.name);
              } catch (error) {
                core.warning(`Could not resolve workflow name for check ${check.name}: ${error.message}`);
              }
            }
            const checks = rawChecks.map((check) => ({
              name: normalizeCheckName(
                workflowNames.get(check.details_url?.match(/\/actions\/runs\/(\d+)/)?.[1]) ?? "",
                check.name,
              ),
              status: check.status,
              conclusion: check.conclusion,
            }));
            const failedChecks = [];
            for (const check of rawChecks
              .filter((item) => item.status === "completed" && !["success", "neutral", "skipped"].includes(item.conclusion))
              .sort((left, right) => left.name.localeCompare(right.name, "en"))) {
              let annotations = [];
              try {
                annotations = (await github.rest.checks.listAnnotations({
                  ...context.repo,
                  check_run_id: check.id,
                  per_page: 20,
                })).data;
              } catch (error) {
                core.warning(`Could not load bounded annotations for ${check.name}: ${error.message}`);
              }
              const excerpt = [
                check.output?.title,
                check.output?.summary,
                check.output?.text,
                ...annotations.map((annotation) =>
                  `${annotation.path ?? "unknown"}:${annotation.start_line ?? 0}: ${annotation.message ?? ""}`
                ),
              ].filter(Boolean).join("\n").slice(0, 8_000);
              failedChecks.push({
                name: normalizeCheckName(
                  workflowNames.get(check.details_url?.match(/\/actions\/runs\/(\d+)/)?.[1]) ?? "",
                  check.name,
                ),
                logExcerpt: excerpt,
              });
            }

            const reviewThreads = [];
            let cursor = null;
            do {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          path
                          line
                          comments(first: 100) { nodes { body } }
                        }
                      }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: pullNumber, cursor },
              );
              const page = data.repository.pullRequest.reviewThreads;
              for (const thread of page.nodes) {
                const bodies = thread.comments.nodes.map((comment) => comment.body);
                reviewThreads.push({
                  resolved: thread.isResolved,
                  priority: findReviewPriority(bodies),
                  path: thread.path,
                  line: thread.line,
                  body: bodies.join("\n").slice(0, 4_000),
                });
              }
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            const snapshot = {
              repository,
              actor: process.env.ATLAS_ACTOR,
              triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR,
              author: pull.user.login,
              prNumber: pull.number,
              state: pull.state,
              draft: pull.draft,
              baseBranch: pull.base.ref,
              headBranch: pull.head.ref,
              headSha: pull.head.sha,
              baseRepository: pull.base.repo?.full_name ?? repository,
              headRepository: pull.head.repo?.full_name ?? "",
              isFork: pull.head.repo?.fork === true || pull.head.repo?.full_name !== pull.base.repo?.full_name,
              labels: pull.labels.map((label) => label.name),
              files: files.map((file) => ({
                filename: file.filename,
                previous_filename: file.previous_filename ?? null,
              })),
              changedFiles: pull.changed_files,
              additions: pull.additions,
              deletions: pull.deletions,
              checks,
              failedChecks,
              mergeable: pull.mergeable,
              reviewThreads,
              validationCommands: ["npm run test:unit", "npm run lint", "npm run build", "git diff --check"],
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/atlas-pr-repair-input.json`, JSON.stringify(snapshot));

      - name: Evaluate supervisor facts from trusted code
        run: >-
          node scripts/atlas-pr-supervisor.mjs
          --config .github/atlas-autopilot.yml
          < "$RUNNER_TEMP/atlas-pr-repair-input.json"
          > "$RUNNER_TEMP/atlas-pr-supervisor-result.json"

      - name: Bind supervisor result, audit metadata and automatic eligibility
        id: gate
        uses: actions/github-script@v8
        env:
          TRIGGER_SOURCE: ${{ steps.trigger.outputs.source }}
          OBSERVED_STATUS: ${{ steps.trigger.outputs.supervisor-status }}
          OBSERVED_FINGERPRINT: ${{ steps.trigger.outputs.state-fingerprint }}
          OBSERVED_HEAD_SHA: ${{ steps.trigger.outputs.head-sha }}
          TRUSTED_WORKFLOW_SHA: ${{ steps.trigger.outputs.trusted-workflow-sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const { parseConfig } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-supervisor.mjs`).href
            );
            const { evaluateAutomaticPlanEligibility, repairStateFingerprint } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-repair-plan.mjs`).href
            );
            const { parseRepairConfig } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-repair-policy.mjs`).href
            );
            const inputPath = `${process.env.RUNNER_TEMP}/atlas-pr-repair-input.json`;
            const input = JSON.parse(fs.readFileSync(inputPath, "utf8"));
            const supervisor = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/atlas-pr-supervisor-result.json`, "utf8"));
            const config = parseConfig(fs.readFileSync(".github/atlas-autopilot.yml", "utf8").split(/^repair:/m)[0]);
            const requiredFailed = input.checks.some((check) =>
              config.required_check_names.includes(check.name) && check.status === "completed" && check.conclusion !== "success"
            );
            const blockingReview = input.reviewThreads.some((thread) =>
              !thread.resolved && config.blocking_review_priorities.includes(thread.priority)
            );
            const explained = requiredFailed || blockingReview;
            input.supervisor = supervisor;
            input.blockReasons = [
              ...(requiredFailed ? ["required_check_failed"] : []),
              ...(blockingReview ? ["blocking_review_found"] : []),
              ...(supervisor.status === "BLOCKED" && !explained ? ["other_supervisor_block"] : []),
            ];
            input.triggerSource = process.env.TRIGGER_SOURCE;
            input.trustedWorkflowSha = process.env.TRUSTED_WORKFLOW_SHA;
            input.supervisorSource = process.env.TRIGGER_SOURCE === "automatic" ? {
              workflow: "Atlas PR Supervisor",
              runId: Number(process.env.SOURCE_RUN_ID),
              runAttempt: Number(process.env.SOURCE_RUN_ATTEMPT),
              observedHeadSha: process.env.OBSERVED_HEAD_SHA,
            } : { workflow: "Atlas PR Repair Plan", runId: context.runId, runAttempt: context.runAttempt };
            if (process.env.TRIGGER_SOURCE === "automatic") {
              const fingerprint = repairStateFingerprint(supervisor);
              if (supervisor.status !== process.env.OBSERVED_STATUS || fingerprint !== process.env.OBSERVED_FINGERPRINT) {
                core.setFailed("Current trusted Supervisor evaluation differs from the completed Supervisor observation.");
                return;
              }
              input.supervisorObservedHeadSha = process.env.OBSERVED_HEAD_SHA;
              input.autopilotRequiredLabel = config.required_label;
              const eligibility = evaluateAutomaticPlanEligibility(input, parseRepairConfig(
                fs.readFileSync(".github/atlas-autopilot.yml", "utf8"),
              ));
              if (!eligibility.eligible) {
                core.notice(`Automatic read-only planning suppressed: ${eligibility.reasons.join(", ")}`);
                core.setOutput("create-plan", "false");
                return;
              }
              const artifactName = `atlas-auto-repair-plan-pr-${input.prNumber}-${input.headSha.slice(0, 12)}-${fingerprint}`;
              const existing = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                ...context.repo, name: artifactName, per_page: 100,
              });
              if (existing.some((artifact) => artifact.name === artifactName && !artifact.expired)) {
                core.notice("An automatic read-only plan already exists for this PR head and Supervisor state.");
                core.setOutput("create-plan", "false");
                return;
              }
              core.setOutput("artifact-name", artifactName);
            }
            core.setOutput("create-plan", "true");
            fs.writeFileSync(inputPath, JSON.stringify(input));

      - name: Revalidate head SHA before plan creation
        if: steps.gate.outputs.create-plan == 'true'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pull.outputs.head-sha }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed("expected_head_sha is stale; the pull request head has changed before plan creation.");
            }

      - name: Create deterministic repair plan
        if: steps.gate.outputs.create-plan == 'true'
        id: plan
        env:
          ARTIFACT_NAME: ${{ steps.gate.outputs.artifact-name || format('atlas-repair-plan-pr-{0}-{1}', steps.pull.outputs.number, steps.pull.outputs.short-head-sha) }}
        run: >-
          node scripts/atlas-pr-repair-plan.mjs
          --config .github/atlas-autopilot.yml
          --output-dir "$RUNNER_TEMP/atlas-repair-plan"
          --artifact-name "$ARTIFACT_NAME"
          < "$RUNNER_TEMP/atlas-pr-repair-input.json"
          > "$RUNNER_TEMP/atlas-pr-repair-plan.json"

      - name: Write repair plan summary
        if: steps.gate.outputs.create-plan == 'true'
        run: cat "$RUNNER_TEMP/atlas-repair-plan/repair-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repair plan artifact
        if: steps.gate.outputs.create-plan == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.gate.outputs.artifact-name || format('atlas-repair-plan-pr-{0}-{1}', steps.pull.outputs.number, steps.pull.outputs.short-head-sha) }}
          path: |
            ${{ runner.temp }}/atlas-repair-plan/repair-plan.json
            ${{ runner.temp }}/atlas-repair-plan/repair-plan.md
          if-no-files-found: error
          retention-days: 7
