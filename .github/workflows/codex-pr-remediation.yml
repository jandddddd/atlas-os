name: Bounded Codex PR Remediation

on:
  pull_request_target:
    types: [synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-pr-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Plan bounded remediation action
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { encodeState, findPriority, planRemediation } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/codex-pr-remediation.mjs`).href
            );
            const pullNumber = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pullNumber, per_page: 100,
            });
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pullNumber, per_page: 100,
            });

            const reviewComments = context.eventName === "pull_request_review"
              ? await github.paginate(github.rest.pulls.listCommentsForReview, {
                  ...context.repo,
                  pull_number: pullNumber,
                  review_id: context.payload.review.id,
                  per_page: 100,
                })
              : [];
            const findings = reviewComments.flatMap((comment) => {
              const priority = findPriority(comment.body);
              return priority ? [{ id: String(comment.id), priority, path: comment.path, body: comment.body }] : [];
            });
            const event = context.eventName === "pull_request_review"
              ? { name: "review", reviewHeadSha: context.payload.review.commit_id }
              : { name: "synchronize", before: context.payload.before };
            const result = planRemediation({
              event,
              pull: {
                number: pull.number,
                state: pull.state,
                draft: pull.draft,
                baseRef: pull.base.ref,
                headRef: pull.head.ref,
                baseRepository: pull.base.repo.full_name,
                headRepository: pull.head.repo?.full_name,
                headSha: pull.head.sha,
                changedPaths: files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean)),
              },
              findings,
              comments: issueComments.map((comment) => ({
                author: comment.user?.login,
                createdAt: comment.created_at,
                body: comment.body,
              })),
            });

            let body = "";
            if (result.action === "REQUEST_REMEDIATION") {
              body = `${encodeState(result.state)}\n@codex address that feedback\n\nAddress only the currently open P1/P2 review feedback on this pull request. ` +
                `This is bounded remediation round ${result.state.round}/2 for exact head \`${result.state.boundHead}\`. ` +
                `Read and follow \`.github/codex/pr-remediation-policy.md\`. Validate before one normal push to this same PR branch; stop and report instead if any escalation condition applies.`;
            } else if (result.action === "REQUEST_REVIEW") {
              body = `${encodeState(result.state)}\n@codex review\n\nReview exact head \`${result.state.boundHead}\` after bounded remediation round ${result.state.round}/2.`;
            } else if (result.action === "ESCALATE") {
              const state = result.state
                ? { ...result.state, phase: "escalated", boundHead: pull.head.sha }
                : { version: 1, prNumber: pull.number, round: 1, phase: "escalated", boundHead: pull.head.sha, originalPaths: [], findingIds: [] };
              body = `${encodeState(state)}\n## Codex remediation requires human review\n\n${result.reason}\n\nNo automated remediation, push, or merge was requested.`;
            }
            core.setOutput("action", result.action);
            core.setOutput("comment", body);
            core.info(`${result.action}: ${result.reason ?? "bounded transition accepted"}`);

      - name: Publish Codex command or escalation
        if: steps.plan.outputs.comment != ''
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.plan.outputs.comment }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.COMMENT_BODY,
            });
