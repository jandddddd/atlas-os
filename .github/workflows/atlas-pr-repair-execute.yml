name: Atlas PR Repair Execute

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull-Request-Nummer
        required: true
        type: number
      expected_head_sha:
        description: Erwarteter vollständiger Head-SHA
        required: true
        type: string
      repair_plan_run_id:
        description: Run-ID des validierten Repair-Plans
        required: true
        type: number
      confirm:
        description: Zur Bestätigung exakt EXECUTE_REPAIR eingeben
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: atlas-pr-repair-execute-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  execute:
    environment: atlas-repair-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main branch
        id: trusted-checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize trusted audit reporting
        id: audit-init
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-repair-trusted"
          cp scripts/atlas-pr-repair-plan.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-plan.mjs"
          cp scripts/atlas-pr-repair-policy.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-policy.mjs"
          cp scripts/atlas-pr-repair-execute.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-execute.mjs"
          echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "trusted-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate manual confirmation
        id: dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PLAN_RUN_ID: ${{ inputs.repair_plan_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { validateDispatch } from "./scripts/atlas-pr-repair-execute.mjs";
          validateDispatch({
            confirm: process.env.CONFIRM,
            prNumber: Number(process.env.PR_NUMBER),
            expectedHeadSha: process.env.EXPECTED_HEAD_SHA,
            planRunId: Number(process.env.PLAN_RUN_ID),
          });
          NODE

      - name: Enforce trusted repair policy
        id: policy
        env:
          CONFIRM: ${{ inputs.confirm }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PLAN_RUN_ID: ${{ inputs.repair_plan_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validateDispatch, validateExecutionPolicy } from "./scripts/atlas-pr-repair-execute.mjs";
          validateDispatch({
            confirm: process.env.CONFIRM,
            prNumber: Number(process.env.PR_NUMBER),
            expectedHeadSha: process.env.EXPECTED_HEAD_SHA,
            planRunId: Number(process.env.PLAN_RUN_ID),
          });
          validateExecutionPolicy(readFileSync(".github/atlas-autopilot.yml", "utf8"));
          NODE

      - name: Validate PR and pilot gates
        id: pilot
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const { evaluatePilotGates, parseRepairConfig } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-repair-policy.mjs`).href
            );
            const { pullRequestPilotContext, validatePullRequest } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-repair-execute.mjs`).href
            );
            const policy = parseRepairConfig(fs.readFileSync(".github/atlas-autopilot.yml", "utf8"));
            const pullNumber = Number(process.env.PR_NUMBER);
            const expected = process.env.EXPECTED_HEAD_SHA;
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
            const pilotContext = pullRequestPilotContext(pull, {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              expectedHeadSha: expected,
              actor: process.env.ATLAS_ACTOR,
              triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR,
            });
            const pilot = evaluatePilotGates(policy, pilotContext);
            core.setOutput("pr-author", pull.user.login);
            core.setOutput("base-branch", pull.base.ref);
            core.setOutput("base-repository", pull.base.repo.full_name);
            core.setOutput("head-repository", pull.head.repo.full_name);
            core.setOutput("pilot-gates", JSON.stringify(pilot.gates));
            const validated = validatePullRequest(pull, policy, `${context.repo.owner}/${context.repo.repo}`, expected, {
              actor: process.env.ATLAS_ACTOR,
              triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR,
            });
            core.setOutput("head-branch", validated.headBranch);
            core.setOutput("head-sha", validated.headSha);

      - name: Validate plan workflow run and attempt availability
        id: pull
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PLAN_RUN_ID: ${{ inputs.repair_plan_run_id }}
          PILOT_HEAD_BRANCH: ${{ steps.pilot.outputs.head-branch }}
          PILOT_HEAD_SHA: ${{ steps.pilot.outputs.head-sha }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { attemptTagName, isTrustedRepairPlanWorkflowPath } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/atlas-pr-repair-execute.mjs`).href
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const expected = process.env.EXPECTED_HEAD_SHA;
            const planRunId = Number(process.env.PLAN_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: planRunId });
            if (run.event !== "workflow_dispatch" || run.head_branch !== "main" || run.conclusion !== "success" ||
                !isTrustedRepairPlanWorkflowPath(run.path)) {
              throw new Error("repair_plan_run_id is not a successful trusted-main repair-plan run.");
            }
            const tagName = attemptTagName(pullNumber, expected);
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tagName}` });
              throw new Error("This attemptKey has already been reserved or executed.");
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput("head-branch", process.env.PILOT_HEAD_BRANCH);
            core.setOutput("head-sha", process.env.PILOT_HEAD_SHA);
            core.setOutput("plan-artifact", `atlas-repair-plan-pr-${pullNumber}-${expected.slice(0, 12)}`);
            core.setOutput("attempt-tag", tagName);

      - name: Download bound repair plan artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.pull.outputs.plan-artifact }}
          path: ${{ runner.temp }}/atlas-repair-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repair_plan_run_id }}

      - name: Validate repair plan artifact
        id: plan
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { validatePlanArtifact } from "./scripts/atlas-pr-repair-execute.mjs";
          const directory = `${process.env.RUNNER_TEMP}/atlas-repair-plan`;
          const files = readdirSync(directory, { withFileTypes: true });
          if (files.some((entry) => !entry.isFile())) throw new Error("Repair plan artifact contains a directory or non-file entry.");
          const plan = JSON.parse(readFileSync(`${directory}/repair-plan.json`, "utf8"));
          validatePlanArtifact(files.map((entry) => entry.name), plan, {
            prNumber: Number(process.env.PR_NUMBER), expectedHeadSha: process.env.EXPECTED_HEAD_SHA,
          });
          writeFileSync(".git/atlas-repair-prompt.txt", plan.prompt, { mode: 0o600 });
          writeFileSync(`${process.env.RUNNER_TEMP}/atlas-validated-plan.json`, JSON.stringify(plan));
          const digest = createHash("sha256").update(readFileSync(`${directory}/repair-plan.json`)).digest("hex");
          writeFileSync(`${process.env.RUNNER_TEMP}/atlas-repair-plan-digest`, digest);
          NODE

      - name: Preserve trusted enforcement code outside the PR workspace
        id: enforcement
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-repair-trusted"
          cp scripts/atlas-pr-repair-plan.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-plan.mjs"
          cp scripts/atlas-pr-repair-policy.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-policy.mjs"
          cp scripts/atlas-pr-repair-execute.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-execute.mjs"
          cp scripts/atlas-pr-repair-tree-check.mjs "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-tree-check.mjs"
          cp .github/atlas-autopilot.yml "$RUNNER_TEMP/atlas-repair-trusted/atlas-autopilot.yml"

      - name: Checkout the exact PR head for repair
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pull.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore validated prompt inside Git metadata
        id: prompt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/atlas-validated-plan.json`, "utf8"));
          writeFileSync(".git/atlas-repair-prompt.txt", plan.prompt, { mode: 0o600 });
          NODE

      - name: Revalidate PR head immediately before repair
        id: head
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR_NUMBER) });
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const { parseRepairConfig } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-pr-repair-policy.mjs`).href);
            const { validatePullRequest } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-pr-repair-execute.mjs`).href);
            const policy = parseRepairConfig(fs.readFileSync(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-autopilot.yml`, "utf8"));
            validatePullRequest(pull, policy, `${context.repo.owner}/${context.repo.repo}`, process.env.EXPECTED_HEAD_SHA, {
              actor: process.env.ATLAS_ACTOR, triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR,
            });
            if (pull.head.ref !== process.env.HEAD_BRANCH) throw new Error("Repair branch changed immediately before repair.");

      - name: Validate OpenAI credential availability
        id: secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { pathToFileURL } from "node:url";
          const { requireOpenAiApiKey } = await import(
            pathToFileURL(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-pr-repair-execute.mjs`).href
          );
          requireOpenAiApiKey(process.env.OPENAI_API_KEY);
          NODE

      - name: Reserve the single repair attempt
        id: reserve
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          ATTEMPT_TAG: ${{ steps.pull.outputs.attempt-tag }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const pullNumber = Number(process.env.PR_NUMBER);
            const expected = process.env.EXPECTED_HEAD_SHA;
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
            const { parseRepairConfig } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-pr-repair-policy.mjs`).href);
            const { validatePullRequest } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-pr-repair-execute.mjs`).href);
            const policy = parseRepairConfig(fs.readFileSync(`${process.env.RUNNER_TEMP}/atlas-repair-trusted/atlas-autopilot.yml`, "utf8"));
            const validated = validatePullRequest(pull, policy, `${context.repo.owner}/${context.repo.repo}`, expected, {
              actor: process.env.ATLAS_ACTOR, triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR,
            });
            if (validated.headBranch !== process.env.HEAD_BRANCH) throw new Error("Repair branch changed immediately before attempt reservation.");
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.ATTEMPT_TAG}` });
              throw new Error("This attemptKey has already been reserved or executed.");
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${process.env.ATTEMPT_TAG}`,
              sha: expected,
            });
            core.setOutput("reserved", "true");

      - name: Run one bounded Codex repair attempt
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .git/atlas-repair-prompt.txt
          working-directory: .
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-version: "0.144.5"

      - name: Remove transient prompt
        id: cleanup
        if: always()
        run: rm -f .git/atlas-repair-prompt.txt

      - name: Validate repair scope and size
        id: scope
        env:
          ATLAS_REPAIR_TRUSTED: ${{ runner.temp }}/atlas-repair-trusted
          ATLAS_REPAIR_MODULE_ROOT: ${{ runner.temp }}/atlas-repair-trusted
          ATLAS_REPAIR_POLICY: ${{ runner.temp }}/atlas-repair-trusted/atlas-autopilot.yml
          ATLAS_REPAIR_PLAN: ${{ runner.temp }}/atlas-validated-plan.json
          ATLAS_REPAIR_CHANGED_FILES: ${{ runner.temp }}/atlas-repair-changed-files.json
        run: node "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-tree-check.mjs"

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --include-workspace-root

      - name: Unit tests
        id: unit
        run: npm run test:unit

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: Check patch whitespace
        id: diff
        run: git diff HEAD --check

      - name: Revalidate complete repair tree after tests
        id: tree
        env:
          ATLAS_REPAIR_TRUSTED: ${{ runner.temp }}/atlas-repair-trusted
          ATLAS_REPAIR_MODULE_ROOT: ${{ runner.temp }}/atlas-repair-trusted
          ATLAS_REPAIR_POLICY: ${{ runner.temp }}/atlas-repair-trusted/atlas-autopilot.yml
          ATLAS_REPAIR_PLAN: ${{ runner.temp }}/atlas-validated-plan.json
          ATLAS_REPAIR_CHANGED_FILES: ${{ runner.temp }}/atlas-repair-changed-files.json
        run: node "$RUNNER_TEMP/atlas-repair-trusted/atlas-pr-repair-tree-check.mjs"

      - name: Prepare trusted Git config for remote revalidation
        id: fetch_config
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          test -d .git
          test ! -L .git
          trusted_config="$(mktemp "$RUNNER_TEMP/atlas-repair-fetch-git-config.XXXXXX")"
          git config --file "$trusted_config" core.repositoryFormatVersion 0
          git config --file "$trusted_config" core.fileMode true
          git config --file "$trusted_config" core.bare false
          rm -f .git/config
          install -m 600 "$trusted_config" .git/config

      - name: Revalidate remote head before commit
        id: remote
        env:
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/$HEAD_BRANCH:refs/remotes/origin/atlas-repair-target"
          unset GITHUB_TOKEN
          test "$(git rev-parse refs/remotes/origin/atlas-repair-target)" = "$EXPECTED_HEAD_SHA"

      - name: Revalidate current pilot gates before commit
        id: precommit
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const trusted = `${process.env.RUNNER_TEMP}/atlas-repair-trusted`;
            const { validateExecutionPolicy, validatePullRequest } = await import(
              pathToFileURL(`${trusted}/atlas-pr-repair-execute.mjs`).href
            );
            const { data: policyFile } = await github.rest.repos.getContent({
              ...context.repo, path: ".github/atlas-autopilot.yml", ref: "main",
            });
            if (Array.isArray(policyFile) || policyFile.type !== "file" || policyFile.encoding !== "base64") {
              throw new Error("Current main repair policy is not a regular base64-encoded file.");
            }
            const policy = validateExecutionPolicy(Buffer.from(policyFile.content, "base64").toString("utf8"));
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            const validated = validatePullRequest(
              pull, policy, `${context.repo.owner}/${context.repo.repo}`, process.env.EXPECTED_HEAD_SHA,
              { actor: process.env.ATLAS_ACTOR, triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR },
            );
            if (validated.headBranch !== process.env.HEAD_BRANCH) {
              throw new Error("Repair branch changed immediately before commit.");
            }

      - name: Commit approved repair
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git -c core.hooksPath=/dev/null commit -m "fix(autopilot): apply approved repair plan" \
            -m "Atlas-Repair-Attempt: ${{ inputs.pr_number }}:${{ inputs.expected_head_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate current pilot gates before push
        id: prepush
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          ATLAS_ACTOR: ${{ github.actor }}
          ATLAS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const trusted = `${process.env.RUNNER_TEMP}/atlas-repair-trusted`;
            const { validateExecutionPolicy, validatePullRequest } = await import(
              pathToFileURL(`${trusted}/atlas-pr-repair-execute.mjs`).href
            );
            const { data: policyFile } = await github.rest.repos.getContent({
              ...context.repo, path: ".github/atlas-autopilot.yml", ref: "main",
            });
            if (Array.isArray(policyFile) || policyFile.type !== "file" || policyFile.encoding !== "base64") {
              throw new Error("Current main repair policy is not a regular base64-encoded file.");
            }
            const policy = validateExecutionPolicy(Buffer.from(policyFile.content, "base64").toString("utf8"));
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            const validated = validatePullRequest(
              pull, policy, `${context.repo.owner}/${context.repo.repo}`, process.env.EXPECTED_HEAD_SHA,
              { actor: process.env.ATLAS_ACTOR, triggeringActor: process.env.ATLAS_TRIGGERING_ACTOR },
            );
            if (validated.headBranch !== process.env.HEAD_BRANCH) {
              throw new Error("Repair branch changed immediately before push.");
            }

      - name: Push once to the existing PR branch
        id: push
        env:
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          test -d .git
          test ! -L .git
          trusted_config="$(mktemp "$RUNNER_TEMP/atlas-repair-git-config.XXXXXX")"
          git config --file "$trusted_config" core.repositoryFormatVersion 0
          git config --file "$trusted_config" core.fileMode true
          git config --file "$trusted_config" core.bare false
          rm -f .git/config
          install -m 600 "$trusted_config" .git/config
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_BRANCH"

      - name: Create final audit report
        id: audit
        if: always() && steps.audit-init.outcome == 'success'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PLAN_RUN_ID: ${{ inputs.repair_plan_run_id }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          ATTEMPT_TAG: ${{ steps.pull.outputs.attempt-tag }}
          STARTED_AT: ${{ steps.audit-init.outputs.started-at }}
          STEP_DISPATCH: ${{ steps.dispatch.outcome }}
          STEP_POLICY: ${{ steps.policy.outcome }}
          STEP_PILOT: ${{ steps.pilot.outcome }}
          STEP_PULL: ${{ steps.pull.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_PLAN: ${{ steps.plan.outcome }}
          STEP_ENFORCEMENT: ${{ steps.enforcement.outcome }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_PROMPT: ${{ steps.prompt.outcome }}
          STEP_HEAD: ${{ steps.head.outcome }}
          STEP_SECRET: ${{ steps.secret.outcome }}
          STEP_RESERVE: ${{ steps.reserve.outcome }}
          STEP_CODEX: ${{ steps.codex.outcome }}
          STEP_CLEANUP: ${{ steps.cleanup.outcome }}
          STEP_SCOPE: ${{ steps.scope.outcome }}
          STEP_SETUP: ${{ steps.setup.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_UNIT: ${{ steps.unit.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_DIFF: ${{ steps.diff.outcome }}
          STEP_TREE: ${{ steps.tree.outcome }}
          STEP_FETCH_CONFIG: ${{ steps.fetch_config.outcome }}
          STEP_REMOTE: ${{ steps.remote.outcome }}
          STEP_PRECOMMIT: ${{ steps.precommit.outcome }}
          STEP_COMMIT: ${{ steps.commit.outcome }}
          STEP_PREPUSH: ${{ steps.prepush.outcome }}
          STEP_PUSH: ${{ steps.push.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ steps.pilot.outputs.pr-author }}
          BASE_BRANCH: ${{ steps.pilot.outputs.base-branch }}
          HEAD_BRANCH: ${{ steps.pull.outputs.head-branch }}
          BASE_REPOSITORY: ${{ steps.pilot.outputs.base-repository }}
          HEAD_REPOSITORY: ${{ steps.pilot.outputs.head-repository }}
          PILOT_GATES: ${{ steps.pilot.outputs.pilot-gates }}
          TRUSTED_SHA: ${{ steps.audit-init.outputs.trusted-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const trusted = `${process.env.RUNNER_TEMP}/atlas-repair-trusted`;
          const { createExecutionReport, deriveExecutionOutcome, writeExecutionReport } = await import(
            pathToFileURL(`${trusted}/atlas-pr-repair-execute.mjs`).href
          );
          const steps = Object.fromEntries(
            ["dispatch", "policy", "pilot", "pull", "download", "plan", "enforcement", "checkout", "prompt", "head",
              "secret", "reserve", "codex", "cleanup", "scope", "setup", "install", "unit", "lint", "build",
              "diff", "tree", "fetch_config", "remote", "precommit", "commit", "prepush", "push"]
              .map((name) => [name, process.env[`STEP_${name.toUpperCase()}`] ?? "skipped"]),
          );
          const outcome = deriveExecutionOutcome(steps);
          const changedFilesPath = `${process.env.RUNNER_TEMP}/atlas-repair-changed-files.json`;
          const changedFiles = existsSync(changedFilesPath)
            ? JSON.parse(readFileSync(changedFilesPath, "utf8"))
            : [];
          const report = createExecutionReport({
            repository: process.env.REPOSITORY, runId: Number(process.env.RUN_ID), runUrl: process.env.RUN_URL,
            actor: process.env.ACTOR, triggeringActor: process.env.TRIGGERING_ACTOR, prAuthor: process.env.PR_AUTHOR,
            baseBranch: process.env.BASE_BRANCH, headBranch: process.env.HEAD_BRANCH,
            baseRepository: process.env.BASE_REPOSITORY, headRepository: process.env.HEAD_REPOSITORY,
            trustedPolicySha: process.env.TRUSTED_SHA, trustedWorkflowSha: process.env.TRUSTED_SHA,
            prNumber: Number(process.env.PR_NUMBER), expectedHeadSha: process.env.EXPECTED_HEAD_SHA,
            planRunId: Number(process.env.PLAN_RUN_ID), ...outcome,
            planDigest: existsSync(`${process.env.RUNNER_TEMP}/atlas-repair-plan-digest`)
              ? readFileSync(`${process.env.RUNNER_TEMP}/atlas-repair-plan-digest`, "utf8") : null,
            pilotGateResults: process.env.PILOT_GATES ? JSON.parse(process.env.PILOT_GATES) : [],
            attemptTag: process.env.ATTEMPT_TAG,
            startedAt: process.env.STARTED_AT, finishedAt: new Date().toISOString(),
            changedFiles,
            tests: {
              "npm run test:unit": steps.unit,
              "npm run lint": steps.lint,
              "npm run build": steps.build,
              "git diff --check": steps.diff,
            },
            commitSha: process.env.COMMIT_SHA,
          });
          await writeExecutionReport(`${process.env.RUNNER_TEMP}/atlas-repair-report`, report);
          NODE

      - name: Upload read-only execution audit
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-repair-execution-report-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/atlas-repair-report/repair-execution-report.json
            ${{ runner.temp }}/atlas-repair-report/repair-execution-report.md
          if-no-files-found: error
          retention-days: 7
